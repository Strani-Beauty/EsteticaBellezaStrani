name: esteticaybellezastrani
description: "Estética y Belleza Strani — Plataforma integral de gestión de servicios estéticos."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Design ────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  signature: ^5.4.0
  flutter_svg: ^2.0.17
  dicebear_core: ^10.0.0
  dicebear_styles: ^10.0.0

  # ── Supabase & Network ─────────────────────────────────────
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  http: ^1.6.0

  # ── State Management ───────────────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ── Functional Programming (Either) ───────────────────────
  fpdart: ^1.1.0

  # ── Dependency Injection ───────────────────────────────────
  get_it: ^8.0.2

  # ── Navigation ─────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Payments ───────────────────────────────────────────────
  flutter_stripe: ^11.3.0

  # ── Utilities ──────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.5.0
  flutter_map: 7.0.2
  latlong2: 0.9.1
  url_launcher: 6.3.1
  geolocator: ^13.0.2
  file_picker: ^8.1.4
  web: ^1.1.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_stripe_web: 6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/face_maps/
